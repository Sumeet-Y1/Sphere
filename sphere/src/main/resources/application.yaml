spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sphere_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:sphere-super-secret-jwt-key-2024}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.3-70b-versatile

news:
  api:
    key: ${NEWS_API_KEY:}
    url: https://newsapi.org/v2

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    bucket-name: ${AWS_BUCKET_NAME:sphere-uploads}
    region: ${AWS_REGION:ap-south-1}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dxr5ejhz4}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

admin:
  secret-key: ${ADMIN_SECRET_KEY:}